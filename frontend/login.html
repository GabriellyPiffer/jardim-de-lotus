<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jardim de Lótus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="./assets/logoLotus.png" alt="Logo Jardim de Lótus" class="logo">
            <p>Bem-vindo(a) de volta!</p>

            <form id="formLogin">

                <label>CPF</label>
                <input type="text" id="cpf" placeholder="Digite seu CPF" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <button type="submit" onclick="window.location.href='flores.html'">
    Entrar
</button>

            </form>

            <span>
                Não possui cadastro?
                <a href="cadastro.html">Cadastre-se</a>
            </span>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
