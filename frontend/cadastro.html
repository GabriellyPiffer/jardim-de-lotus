<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Jardim de Lótus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <img src="./assets/logoLotus.png" alt="Logo Jardim de Lótus" class="logo">

        <p>Crie sua conta</p>

        <form id="formCadastro">

            <label>Nome</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label>CPF</label>
            <input
                type="text"
                id="cpf"
                placeholder="Digite seu CPF"
                maxlength="11"
                required
            >

            <label>Telefone</label>
            <input
                type="text"
                id="telefone"
                placeholder="Digite seu telefone"
                required
            >

            <label>E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <span>
            Já possui conta?
            <a href="login.html">Entrar</a>
        </span>

    </div>

</div>

<script src="cadastro.js"></script>

</body>
</html>
